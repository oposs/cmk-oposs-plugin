name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      - run: ruff check .
      - name: JSON files parse
        run: for f in .claude-plugin/*.json skills/checkmk-plugin/evals/evals.json; do python -m json.tool "$f" > /dev/null || exit 1; done

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # the Python Checkmk 2.3 runs on
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/checkmk-plugin/assets/requirements-dev.txt
      - run: pip install -r skills/checkmk-plugin/assets/requirements-dev.txt
      # No cache for .cmk-api/: the fresh fetch from GitHub is part of what this tests.
      - run: ci/test-harness.sh "$RUNNER_TEMP/plugin"
